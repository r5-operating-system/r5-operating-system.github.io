# Builds the site and publishes it on GitHub Pages:
# on every change, once a day (fresh What's new and pull requests), and by hand.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Keep cut-out screenshots between runs
        uses: actions/cache@v4
        with:
          path: .cache
          key: shots-${{ hashFiles('screenshots/**', 'tools/cutout.py') }}
          restore-keys: shots-
      - name: Fetch What's new and pull requests from r5os
        run: python tools/fetch.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
