# ---------------------------------------------------------------- Developers

[developers]
kicker = "Developers"
title = "Build for R5.<br>Or build R5."
text = "Your Haiku apps run as they are. R5 adds kits next to the Haiku API for the things a modern desktop needs. All R5 code is MIT."
kits_title = "The R5 kits"
kits = [
  "<b>Appearance Kit</b> — cards, controls, themes, effects",
  "<b>Admin Kit</b> — safe administrator requests",
  "<b>Icons</b> — system icons in one call",
  "<b>Vulkan</b> — RADV on the graphics chip, Lavapipe without",
  "<b>Wi-Fi Kit</b> and <b>Bluetooth Kit</b>",
  "<b>Power Kit</b> — battery and profiles",
  "<b>Game Kit</b> — controllers, rumble, triggers",
  "<b>MIDI 2 Kit</b>",
  "<b>Settings modules</b> — add your own page",
  "<b>Accounts</b> — several people, one computer",
]

  [[developers.card]]
  title = "R5Book"
  text = "The developer guide, laid out like a classic API book: every R5 kit, with examples and the design guidelines."
  link = "Open the R5Book →"
  url = "r5book"

  [[developers.card]]
  title = "The source"
  text = "Everything is on GitHub: the code, the issues, and the honest changelog of what was tested where."
  link = "r5-operating-system/r5os →"
  url = "github"

  [[developers.card]]
  title = "Help out"
  text = "Pick an issue, port an app, or test on your own hardware and tell us what broke."
  link = "Open issues →"
  url = "https://github.com/r5-operating-system/r5os/issues"


