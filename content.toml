# R5 Operating System website — all texts live here.
#
# Edit this file on github.com (pencil icon), click "Commit changes",
# and the site updates itself within a few minutes.
#
# Rules of thumb:
# - Text goes between "quotes". Longer text between """triple quotes""".
# - A line that starts with # is a note and is not shown on the site.
# - Screenshots: put the PNG in the screenshots/ folder and add a [[shot]] block below.

[site]
name = "R5 Operating System"
tagline = "Same soul. Fresh pixels."
description = "R5 is an independent desktop operating system built on Haiku. Fast, simple, yours, and finally a little bit flashy."
github = "https://github.com/r5-operating-system/r5os"
r5book = "/r5book/"
version = "2026.1-dev"   # filled in automatically from r5os when available

# ---------------------------------------------------------------- Home

[home.hero]
kicker = "R5 Operating System"
title = "Same soul.<br>Fresh pixels."
text = "An independent desktop built on Haiku. Fast, simple, yours, and finally a little bit flashy."
pill = "not released yet"
shot = "hero"              # the big window
extra = "signin"           # small window in front (optional)
deskbar = "hero-deskbar"   # the Deskbar at the top right (optional)

[home.graphics]
kicker = "01 · Graphics"
title = "Your graphics chip finally has a job."
text = "Every window drawn on the GPU. Soft shadows, frosted glass, Vulkan and OpenGL. No Linux required."
hint = "Flip Dark/Light at the top. The pictures follow."
shot = "about"

[home.theming]
kicker = "02 · Make it yours"
title = "Your desktop, your rules."
text = "Pick a Deskbar, pick a window style, and watch it change. Just like in Settings, Theme."

  [[home.theming.deskbar]]
  label = "Standard"
  shot = "deskbar-standard"
  caption = "The Deskbar, reimagined."

  [[home.theming.deskbar]]
  label = "Round"
  shot = "deskbar-round"
  caption = "Soft corners, floating free."

  [[home.theming.deskbar]]
  label = "Pill"
  shot = "deskbar-pill"
  caption = "Small, tidy, out of the way."

  [[home.theming.deskbar]]
  label = "Bar"
  shot = "deskbar-bar"
  caption = "Edge to edge, top or bottom."

  [[home.theming.windows]]
  label = "R5"
  shot = "windows-r5"
  caption = "R5: a crisp yellow tab and straight edges."

  [[home.theming.windows]]
  label = "R5 Modern"
  shot = "windows-modern"
  caption = "R5 Modern: round windows, a soft tab, glass."

  [[home.theming.windows]]
  label = "Classic"
  shot = "windows-classic"
  caption = "Classic (Haiku), for the purists. Grey bar, square tab, the way you remember it."
  quiet = true

[home.features]
kicker = "03 · What's in the box"
title = "The short version."

  [[home.features.item]]
  title = "A fresh new look."
  text = "A fresh visual identity gives R5 a more modern feel. Softer corners, beautiful frosted glass and a dark mode that feels right at home. With three styles to choose from — Quiet, Balanced and Glassy — there's room to make it your own."
  shot = "look"

  [[home.features.item]]
  title = "Graphics in motion."
  text = "Your graphics card is doing more of the heavy lifting, bringing the desktop to life through GPU-accelerated rendering. Under the hood, Skia, Vulkan via RADV and OpenGL make it happen."
  shot = "effects"

  [[home.features.item]]
  title = "Everything in one place."
  text = "Your most important system settings now live together in one place. From display and appearance to Wi-Fi, Bluetooth, power and game controllers, everything is easier to find and manage."
  shot = "hero"

  [[home.features.item]]
  title = "Make yourself at home."
  text = "A proper and secure sign-in experience, screen locking and separate home folders make R5 feel like a complete, personal desktop. Your account, your files, your space."
  shot = "signin"

  [[home.features.item]]
  title = "Better connected."
  text = "Faster, more secure wireless with Wi-Fi 6 and WPA3 on supported cards. IPv6, network discovery and Windows file sharing make it easier to connect to the devices and networks around you."
  shot = "wifi"

  [[home.features.item]]
  title = "Ready for your devices."
  text = "Print wirelessly, stream music to AirPlay speakers and connect the controllers you already own. PlayStation, Xbox, Nintendo and 8BitDo are welcome, with rumble and DualSense adaptive trigger support included."
  shot = "controllers"

  [[home.features.item]]
  title = "Sound, upgraded."
  text = "From more dependable USB audio to HDMI, surround sound and MIDI 2.0, R5 gives you more ways to listen, create and connect your audio gear."
  shot = "sound"

  [[home.features.item]]
  title = "More power. Less waste."
  text = "R5 makes better use of modern 64-bit processors, taking advantage of AVX2 and FMA where available and putting the right work on the right cores. More of your hardware, put to good use."
  shot = "information"

  [[home.features.item]]
  title = "Same soul. Even better."
  text = "Your favourite Haiku applications keep working with the same APIs. No migration, no compatibility headaches. Just the apps you love, on a better desktop."
  shot = "apps"

[home.play]
kicker = "04 · Play"
title = "Controllers? So welcome."
text = "Plug in, or pair over Bluetooth. Test the buttons, feel the rumble. No, we're not kidding."
shot = "controllers"

[home.settings]
kicker = "05 · Settings"
title = "Change it. See it. Done."
text = "Every setting in one tidy window. No Save button, no treasure hunt. Change your mind whenever you like."
shot = "theme"

[home.needyou]
kicker = "06 · We need you"
title = "Your card, in this log."
text = "R5 talks to one graphics chip natively today. The Driver Kit will make the next one a lot easier: describe the chip, fill in the hardware part, pass the tests."
soon = "Driver Kit · coming soon"
button = "★ Follow along on GitHub"
# The lines that appear one by one. kind = ok (green), wait (yellow), no (red), dim (grey).
log = [
  ["dim",  "[    0.412] gpu: looking for graphics chips…"],
  ["ok",   "[    0.418] radeon_hd: Barcelo  ✓ native, on the GPU"],
  ["wait", "[    0.419] Intel UHD Graphics (Comet Lake): Developing"],
  ["no",   "[    0.420] your_card: not found. yet."],
  ["dim",  "[    0.421] gpu: falling back to software. it works, but it could fly."],
]

[home.end]
kicker = "The end · for now"
title = "Not out yet."
text = "No download today. Follow along and be first in line."
button = "★ Follow on GitHub"
button2 = "Read what's new"

