# One block per screenshot.
#   name     = the file name in screenshots/ without .png.
#              For a light and a dark version use name-light.png and name-dark.png.
#   caption  = the line under the picture ("Title — text").
#   tags     = which filter buttons show it.
#   gallery  = false hides it from the Screenshots page (still usable on Home).
#   cut      = false keeps the whole screen instead of cutting out the windows.
#   area     = [left, top, right, bottom] as fractions, to use only part of the screen.

